name: Installer validation and build

on:
  push:
    branches: ['feature/installer-bootstrap']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell runtime version
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            throw "PowerShell 7.6+ is required. Runner has $($PSVersionTable.PSVersion)."
          }

      - name: Run installer logic tests
        shell: pwsh
        run: ./tests/Test-Installer.ps1

      - name: Run package definition tests
        shell: pwsh
        run: ./tests/Test-PackageDefinition.ps1

      - name: Download and verify portable PowerShell runtime
        shell: pwsh
        run: |
          $version = '7.6.9'
          $asset = "PowerShell-$version-win-x64.zip"
          $expectedSha256 = 'CE7484804C0F0AD4DDA10C958E71ACDAF7EEBFB22505C1B480F89E0E9F1DA94D'
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$version/$asset"
          $payload = Join-Path $PWD 'payload\powershell'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "PowerShell archive SHA-256 mismatch. Expected $expectedSha256, got $actualSha256."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $payload -Force
          $pwsh = Join-Path $payload 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw 'Portable archive did not contain pwsh.exe.' }
          Write-Host "Verified PowerShell archive SHA-256: $actualSha256." -ForegroundColor Green

      - name: Download and verify app-local .NET runtime
        shell: pwsh
        run: |
          $metadataUri = 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          $metadata = Invoke-RestMethod -Uri $metadataUri
          $runtimeVersion = [string]$metadata.'latest-runtime'
          if ([string]::IsNullOrWhiteSpace($runtimeVersion)) { throw 'Microsoft release metadata did not provide latest-runtime.' }
          $release = $metadata.releases | Where-Object { $_.runtime.version -eq $runtimeVersion } | Select-Object -First 1
          if (-not $release) { throw "Release metadata for .NET runtime $runtimeVersion was not found." }
          $runtimeAsset = $release.runtime.files | Where-Object {
            $_.rid -eq 'win-x64' -and $_.name -eq 'dotnet-runtime-win-x64.zip'
          } | Select-Object -First 1
          if (-not $runtimeAsset) { throw "Windows x64 .NET runtime archive was not found for $runtimeVersion." }
          $dotnetPayload = Join-Path $PWD 'payload\dotnet'
          New-Item -ItemType Directory -Path $dotnetPayload -Force | Out-Null
          $dotnetArchive = Join-Path $env:RUNNER_TEMP "dotnet-runtime-$runtimeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $runtimeAsset.url -OutFile $dotnetArchive
          $expectedSha512 = [string]$runtimeAsset.hash
          $actualSha512 = (Get-FileHash -LiteralPath $dotnetArchive -Algorithm SHA512).Hash
          if ($actualSha512 -ne $expectedSha512) {
            throw "Microsoft .NET runtime SHA-512 mismatch. Expected $expectedSha512, got $actualSha512."
          }
          Expand-Archive -LiteralPath $dotnetArchive -DestinationPath $dotnetPayload -Force
          if (-not (Test-Path -LiteralPath (Join-Path $dotnetPayload 'host\fxr') -PathType Container)) {
            throw 'App-local .NET runtime host/fxr folder is missing.'
          }
          Write-Host "Verified app-local .NET runtime $runtimeVersion ($actualSha512)." -ForegroundColor Green

      - name: Verify portable PowerShell using app-local .NET
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = Join-Path $PWD 'payload\dotnet'
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          $portablePwsh = Join-Path $PWD 'payload\powershell\pwsh.exe'
          $runtimeVersion = & $portablePwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or $runtimeVersion -ne '7.6.9') {
            throw "Portable PowerShell could not start using the private .NET runtime. Output: $runtimeVersion"
          }
          Write-Host "Portable PowerShell started with private .NET runtime." -ForegroundColor Green

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $version = '6.7.4'
          $installerUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $installerFile = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerFile
          $signature = Get-AuthenticodeSignature -LiteralPath $installerFile
          if ($signature.Status -ne 'Valid') { throw "Inno Setup signature status is $($signature.Status)." }
          if ($signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup publisher: $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installerFile -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup $version installation failed with exit code $($process.ExitCode)." }
          Write-Host "Verified and installed Inno Setup $version." -ForegroundColor Green

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          & $iscc '/Qp' 'installer\ARGONOV.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          $setup = 'dist\ARGONOV-SHELL-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Compiled Setup.exe was not created.' }
          Get-FileHash -LiteralPath $setup -Algorithm SHA256 | Format-List

      - name: Install and uninstall smoke test in runner sandbox
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist\ARGONOV-SHELL-Setup-x64.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'ARGONOV-SMOKE-INSTALL'
          $dependenciesRoot = Join-Path $env:RUNNER_TEMP 'ARGONOV-SMOKE-DEPS'
          $env:ARGONOV_INSTALLER_TEST = '1'
          $env:ARGONOV_DEPENDENCY_ROOT = $dependenciesRoot
          $log = Join-Path $env:RUNNER_TEMP 'argonov-setup-smoke.log'
          $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target","/LOG=$log",'/TASKS=installGit,installPython,installTerminal,installSensors')
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup.exe exited with $($process.ExitCode)." }
          $pwsh = Join-Path $dependenciesRoot 'PowerShell\pwsh.exe'
          $launcher = Join-Path $target 'Start-Argonov.ps1'
          $cmdLauncher = Join-Path $target 'Start-Argonov.cmd'
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw 'Shared PowerShell runtime is missing.' }
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'Installed PowerShell launcher is missing.' }
          if (-not (Test-Path -LiteralPath $cmdLauncher -PathType Leaf)) { throw 'Installed runtime bootstrap command is missing.' }
          $env:DOTNET_ROOT = Join-Path $dependenciesRoot 'dotnet'
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          if (-not (Test-Path -LiteralPath (Join-Path $env:DOTNET_ROOT 'host\fxr') -PathType Container)) {
            throw 'Shared .NET runtime is missing.'
          }
          $version = & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or $version -ne '7.6.9') { throw "Installed PowerShell runtime failed: $version" }

          $launchOutput = & $pwsh -NoLogo -NoProfile -File $launcher 2>&1
          $launchExitCode = $LASTEXITCODE
          if ($launchExitCode -ne 0) {
            $launchOutput | ForEach-Object { Write-Host $_ }
            throw "ARGONOV profile launch failed with exit code $launchExitCode."
          }
          Write-Host 'ARGONOV launcher started the profile successfully.' -ForegroundColor Green

          $gitExe = Join-Path $dependenciesRoot 'Git\cmd\git.exe'
          $pythonExe = Join-Path $dependenciesRoot 'Python314\python.exe'
          $terminalExe = Join-Path $dependenciesRoot 'WindowsTerminal\WindowsTerminal.exe'
          $terminalCli = Join-Path $dependenciesRoot 'WindowsTerminal\wt.exe'
          if (-not (Test-Path -LiteralPath $gitExe -PathType Leaf)) { throw 'Isolated Git dependency was not installed.' }
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) { throw 'Isolated Python 3.14 dependency was not installed.' }
          if (-not (Test-Path -LiteralPath $terminalExe -PathType Leaf)) { throw 'Portable Windows Terminal dependency was not installed.' }
          if (-not (Test-Path -LiteralPath $terminalCli -PathType Leaf)) { throw 'Windows Terminal wt.exe command was not installed.' }
          & $pythonExe -c 'import qrcode; from PIL import Image'
          if ($LASTEXITCODE -ne 0) { throw 'Python qrcode/Pillow package verification failed.' }
          $terminalFragment = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\Fragments\ARGONOV-SHELL\argonov.json'
          if (-not (Test-Path -LiteralPath $terminalFragment -PathType Leaf)) { throw 'ARGONOV Windows Terminal profile fragment was not created.' }
          $fragmentObject = Get-Content -LiteralPath $terminalFragment -Raw | ConvertFrom-Json
          if (-not ($fragmentObject.profiles | Where-Object { $_.name -eq 'ARGONOV SHELL' })) { throw 'ARGONOV profile fragment is invalid.' }
          $lhmLibrary = Join-Path $env:LOCALAPPDATA 'ARGONOV\tools\LibreHardwareMonitor\LibreHardwareMonitorLib.dll'
          if (-not (Test-Path -LiteralPath $lhmLibrary -PathType Leaf)) { throw 'LibreHardwareMonitor backend was not installed.' }
          Write-Host 'Git, Python 3.14, qrcode/Pillow, Windows Terminal and sensor backend verified.' -ForegroundColor Green

          $keepFile = Join-Path $target 'music\uninstall-preservation-test.txt'
          New-Item -ItemType Directory -Path (Split-Path -Parent $keepFile) -Force | Out-Null
          Set-Content -LiteralPath $keepFile -Value 'USER_DATA_MUST_SURVIVE'
          $uninstaller = Join-Path $target 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Uninstaller was not created.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }
          if (-not (Test-Path -LiteralPath $keepFile -PathType Leaf)) { throw 'User data was removed by uninstaller.' }
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw 'Shared PowerShell runtime was removed during shell uninstall.' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:DOTNET_ROOT 'host\fxr') -PathType Container)) { throw 'Shared .NET runtime was removed during shell uninstall.' }
          if (-not (Test-Path -LiteralPath $gitExe -PathType Leaf)) { throw 'Shared Git dependency was removed during shell uninstall.' }
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) { throw 'Shared Python dependency was removed during shell uninstall.' }
          if (-not (Test-Path -LiteralPath $terminalExe -PathType Leaf)) { throw 'Shared Windows Terminal dependency was removed during shell uninstall.' }
          if (-not (Test-Path -LiteralPath $terminalCli -PathType Leaf)) { throw 'Shared Windows Terminal wt.exe was removed during shell uninstall.' }
          Write-Host 'Setup install/uninstall smoke test passed; shell was removed and shared PowerShell/.NET/Git/Python/Terminal dependencies and user data were preserved.' -ForegroundColor Green
          Remove-Item -LiteralPath $target -Recurse -Force
          Remove-Item -LiteralPath $dependenciesRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'ARGONOV') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'Microsoft\Windows Terminal\Fragments\ARGONOV-SHELL') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARGONOV-SHELL-Setup-x64
          path: dist/ARGONOV-SHELL-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
