name: Installer validation
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            throw "PowerShell 7.6+ is required. Runner has $($PSVersionTable.PSVersion)."
          }
      - name: Run installer tests
        shell: pwsh
        run: ./tests/Test-Installer.ps1
