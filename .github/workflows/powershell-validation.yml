name: PowerShell validation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -Filter '*.ps1' -File -Recurse | Sort-Object FullName)

          if ($files.Count -eq 0) {
            throw 'No PowerShell scripts were found.'
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($errorItem in $errors) {
              $relativePath = [System.IO.Path]::GetRelativePath((Get-Location).Path, $file.FullName)
              $failures.Add("$($relativePath):$($errorItem.Extent.StartLineNumber): $($errorItem.Message)") | Out-Null
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            throw "PowerShell parser validation failed with $($failures.Count) error(s)."
          }
          Write-Host "PowerShell parser validation passed for $($files.Count) script(s)." -ForegroundColor Green

      - name: Run smoke-test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'tests/Test-Sysinfo.ps1',
            'tests/Test-AISandbox.ps1',
            'tests/Test-Backup.ps1',
            'tests/Test-Install.ps1',
            'tests/Test-Reorganize.ps1',
            'tests/Test-ProxySettings.ps1',
            'tests/Test-Uninstall.ps1',
            'tests/Test-Wget.ps1'
          )

          foreach ($test in $tests) {
            if (-not (Test-Path -LiteralPath $test -PathType Leaf)) {
              throw "Missing test script: $test"
            }

            Write-Host ([Environment]::NewLine + "=== $test ===") -ForegroundColor Cyan
            & pwsh -NoLogo -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $test (exit code $LASTEXITCODE)"
            }
          }

          Write-Host 'All smoke tests passed.' -ForegroundColor Green
